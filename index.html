<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D100B" />
  <meta name="description" content="Explore Pakistani, Chinese, Indian, and world literature with illustrated edition covers on the Kitab Ghar bookshelf." />
  <title>Kitab Ghar — The Story Shelf</title>
  <!-- Exact font families are requested from their original Google Fonts endpoints.
       The page remains one HTML file, but these fonts and the four art sheets need internet access. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Inter+Tight:wght@500;600&family=Noto+Sans+JP:wght@500&family=Noto+Serif+SC:wght@500;600&family=Noto+Nastaliq+Urdu:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #0D100B;
      --sheet: #151A11;
      --ink: #F0F2E9;
      --muted: #A7AE9C;
      --cobalt: #B9E51B;
      --rule: rgba(185,229,27,.38);
      --ease: cubic-bezier(.16,1,.3,1);
      --H: min(46vh, 31vw);
      --sans: "Inter Tight", "Noto Sans JP", system-ui, sans-serif;
      --serif: "Newsreader", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html { width:100%; height:100%; background:var(--paper); }
    body {
      margin:0; width:100%; height:100%; overflow:hidden;
      background:var(--paper); color:var(--ink);
      font-family:var(--sans); user-select:none;
      -webkit-font-smoothing: antialiased;
      text-rendering:optimizeLegibility;
    }
    button,a { font:inherit; -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    button:focus-visible, a:focus-visible { outline:2px solid var(--cobalt); outline-offset:4px; }
    .lbl {
      font-family:var(--sans); font-weight:600; font-size:10.5px;
      line-height:1; letter-spacing:.09em; text-transform:uppercase; white-space:nowrap;
    }
    .box { display:inline-flex; height:21px; align-items:center; justify-content:center; border:1px solid var(--rule); padding:0 8px; }
    .topbar {
      position:fixed; z-index:12; inset:0 0 auto; height:84px;
      padding:0 32px; display:grid; grid-template-columns:1fr auto 1fr;
      align-items:center; pointer-events:none;
    }
    .topbar > * { pointer-events:auto; }
    .back { justify-self:start; transition:color .3s var(--ease); }
    .back:hover { color:var(--cobalt); }
    .brand { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px; color:var(--cobalt); white-space:nowrap; }
    .brand-zh { font-family:"Noto Nastaliq Urdu", serif; font-weight:500; font-size:23px; letter-spacing:0; line-height:1.9; direction:rtl; }
    .brand-en { font-size:9px; font-family:var(--sans); font-weight:600; letter-spacing:.34em; padding-left:.34em; line-height:1; }
    .career { justify-self:end; }
    .decades {
      position:fixed; z-index:15;
      top:calc(50% - var(--H) / 2 - 86px); left:50%; transform:translateX(-50%);
      display:flex; isolation:isolate;
    }
    .tab-highlight { position:absolute; z-index:-1; left:0; top:0; height:23px; width:0;
      background:var(--cobalt); pointer-events:none;
      transition:transform .6s var(--ease), width .6s var(--ease); }
    .decade-btn { height:23px; padding:0 11px; border:1px solid var(--rule);
      margin-left:-1px; background:transparent; position:relative;
      color:var(--ink); transition:color .45s var(--ease); }
    .decade-btn:first-of-type { margin-left:0; }
    .decade-btn[aria-current="true"] { color:#101409; }
    .shelf {
      position:fixed; z-index:5; left:0; width:100%;
      top:calc(50% - var(--H) / 2 - 40px); height:calc(var(--H) + 80px);
      perspective:2200px; perspective-origin:50% 50%; touch-action:pan-y;
    }
    .stage {
      position:absolute; width:0; height:0; left:50%; top:50%;
      transform-style:preserve-3d;
      --ws:65px; --d:200px;
    }
    .tape { position:absolute; width:0; height:0; left:0; top:0;
      transform-style:preserve-3d; will-change:transform;
    }
    .face {
      position:absolute; height:var(--H); top:calc(var(--H) / -2);
      border-radius:2px; backface-visibility:hidden; background-repeat:no-repeat;
      background-color:#b9ac96; overflow:hidden; transform-style:preserve-3d;
    }
    .face::after {
      content:""; position:absolute; inset:0; border-radius:inherit;
      background:rgba(0,0,0,var(--shade,0)); pointer-events:none;
    }
    .sp { width:var(--ws); left:calc(var(--ws) / -2); transform:translateZ(calc(var(--d) / 2)); }
    .cv {
      width:var(--d); left:calc(var(--d) / -2);
      transform:rotateY(90deg) translateZ(calc(var(--ws) / 2));
      box-shadow:0 30px 60px -28px rgba(20,16,10,.55);
    }
    .play {
      position:fixed; z-index:20; left:50%; top:50%; width:42px; height:42px;
      display:grid; place-items:center; border-radius:50%;
      border:1px solid var(--cobalt); background:rgba(13,16,11,.85);
      color:var(--cobalt); padding:0; transform:translate(-50%,-50%) scale(0);
      will-change:transform;
    }
    .play-triangle {
      width:0; height:0; margin-left:3px; border-top:6px solid transparent;
      border-bottom:6px solid transparent; border-left:10px solid currentColor;
    }
    .caption {
      position:fixed; top:calc(50% + var(--H) / 2 + 30px);
      width:100%; z-index:10; display:flex; flex-direction:column; align-items:center;
      gap:9px; text-align:center; pointer-events:none;
    }
    .cap-mask { position:relative; width:min(92vw,760px); overflow:hidden; }
    .cap-mask > span { position:absolute; inset:0; width:100%; display:block; text-align:center; }
    .cap-mask.title { height:37px; font-family:var(--serif); font-size:31px;
      font-weight:400; line-height:1.12; letter-spacing:-.01em; }
    .cap-mask.sub { height:13px; color:var(--cobalt); font-family:var(--sans);
      font-weight:500; font-size:10.5px; line-height:13px; letter-spacing:.09em; text-transform:uppercase; }
    .cap-mask.year { height:14px; font-family:var(--sans); font-weight:500;
      font-size:11px; line-height:14px; letter-spacing:.08em; }
    .arrow {
      position:fixed; top:calc(50% + var(--H) / 2 + 40px); z-index:15;
      border:0; background:transparent; padding:0; width:44px; height:44px;
      display:grid; place-items:center; color:var(--ink);
      transition:color .3s var(--ease);
    }
    .arrow:hover { color:var(--cobalt); }
    .arrow.left { left:20px; } .arrow.right { right:20px; }
    .arrow svg { width:18px; height:10px; stroke:currentColor; stroke-width:1.2;
      stroke-linejoin:round; fill:none; }
    .footer {
      position:fixed; left:32px; right:32px; bottom:26px;
      display:flex; justify-content:space-between; align-items:center;
      z-index:12; gap:14px;
    }
    .footer .links { display:flex; gap:10px; }
    .footer a:hover { color:var(--cobalt); }
    .grain {
      position:fixed; z-index:40; inset:0; pointer-events:none;
      mix-blend-mode:soft-light; opacity:.15;
      background-repeat:repeat;
    }
    /* Fine-pointer cursor: its motion is controlled exclusively by the rAF engine. */
    .cursor { position:fixed; left:0; top:0; z-index:100; width:58px; height:58px;
      margin-left:-29px; margin-top:-29px; pointer-events:none; visibility:hidden;
      will-change:transform; }
    .cursor-ring { position:absolute; inset:0; border-radius:50%;
      border:1.5px solid var(--ink); background:transparent;
      transform:scale(1); transition:transform .5s var(--ease),
        background-color .4s var(--ease), border-color .4s var(--ease); }
    .cursor-dot { position:absolute; left:26px; top:26px; width:6px; height:6px;
      border-radius:50%; background:var(--ink); transform:scale(1);
      transition:transform .4s var(--ease); }
    .cursor-word { position:absolute; inset:0; display:grid; place-content:center; text-align:center;
      color:white; font-family:var(--sans); font-weight:600; font-size:10px;
      line-height:1.25; letter-spacing:.1em; transform:scale(0);
      transition:transform .45s var(--ease); }
    .cursor[data-mode="spine"] .cursor-ring { transform:scale(.72); }
    .cursor[data-mode="btn"] .cursor-ring { transform:scale(.55); }
    .cursor[data-mode="btn"] .cursor-dot { transform:scale(0); }
    .cursor[data-mode="open"] .cursor-ring { transform:scale(1.75);
      background:var(--cobalt); border-color:var(--cobalt); }
    .cursor[data-mode="open"] .cursor-dot { transform:scale(0); }
    .cursor[data-mode="open"] .cursor-word { transform:scale(1); }
    .detail {
      position:fixed; inset:0; z-index:60; background:var(--sheet); visibility:hidden;
      pointer-events:none; overflow:hidden; clip-path:inset(0); transform:rotate(0deg);
    }
    .detail-top {
      position:absolute; top:0; left:0; right:0; height:84px;
      display:flex; align-items:center; justify-content:center; pointer-events:none;
    }
    .detail-top .brand { pointer-events:auto; }
    .close { position:absolute; top:31px; left:32px; z-index:5;
      background:transparent; color:var(--ink); cursor:pointer; }
    .close:hover { color:var(--cobalt); }
    .detail-grid {
      position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr;
      gap:4vw; align-items:center; padding:110px 6vw 56px 7vw;
    }
    .details-left { width:100%; max-width:520px; display:flex; flex-direction:column;
      align-items:flex-start; gap:18px; min-width:0; }
    .reveal { overflow:hidden; width:100%; }
    .reveal > span, .reveal > .reveal-content { display:block; transform:translateY(110%); }
    .details-sub { color:var(--cobalt); font-weight:500; }
    .details-title { font-family:var(--serif); font-weight:400;
      font-size:clamp(44px,5.4vw,84px); letter-spacing:-.025em;
      line-height:1; padding-top:3px; }
    .details-meta { color:var(--muted); }
    .details-synopsis { font-family:var(--serif); font-size:17px; line-height:1.5;
      max-width:42ch; }
    .details-credit { font-family:var(--serif); font-style:italic; font-size:15px;
      color:var(--muted); line-height:1.35; }
    .details-watch { margin-top:10px; min-height:44px;
      display:inline-flex; align-items:center; justify-content:center;
      padding:0 20px; color:var(--cobalt); border:1px solid var(--cobalt);
      background:transparent; font-size:10.5px; letter-spacing:.09em;
      font-weight:600; text-transform:uppercase; white-space:nowrap;
      transition:background-color .35s var(--ease), color .35s var(--ease); }
    .details-watch:hover { background:var(--cobalt); color:var(--sheet); }
    .watch-status { font-size:10px; color:var(--muted); letter-spacing:.06em;
      text-transform:uppercase; line-height:1.5; max-width:32ch; display:none; }
    .watch-status.shown { display:block; }
    .poster-col { height:100%; display:flex; align-items:center; justify-content:center; min-height:0; }
    .poster { height:min(100%,78vh); width:auto; max-width:100%; aspect-ratio:474 / 750;
      overflow:visible; display:block; filter:drop-shadow(0 24px 30px rgba(23,19,13,.13)); }
    @media (pointer:fine) {
      html,body,button,a { cursor:none !important; }
      .cursor { visibility:visible; }
    }
    @media (max-width:767px) {
      :root { --H:min(60vw,40svh); }
      .topbar { height:64px; padding:0 16px; }
      .brand { gap:4px; }
      .brand-zh { font-size:17px; }
      .brand-en { font-size:7.5px; }
      .lbl { font-size:9px; }
      .career { display:none; }
      .decades { top:calc(50% - var(--H) / 2 - 70px); }
      .decade-btn { padding:0 7px; }
      .caption .cap-mask.title { font-size:24px; height:30px; }
      .caption .cap-mask.sub { font-size:9px; }
      .arrow.left { left:6px; } .arrow.right { right:6px; }
      .footer { left:16px; right:16px; bottom:18px; }
      .detail { overflow-y:auto; overscroll-behavior:contain; }
      .detail-top { height:64px; }
      .close { left:16px; top:21px; }
      .detail-grid { position:relative; min-height:100%; display:flex; flex-direction:column;
        align-items:stretch; gap:24px; padding:84px 22px 40px; }
      .poster-col { order:-1; flex:none; height:46svh; }
      .poster { height:46svh; max-width:100%; }
      .details-left { gap:15px; max-width:none; }
      .details-title { font-size:42px; }
      .details-synopsis { font-size:16px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *, *::before, *::after { transition-duration:0ms !important; }
    }
    ::selection { background:var(--cobalt); color:var(--paper); }
    .brand { transition:color .35s var(--ease); }
    .brand-en { color:var(--muted); font-size:9px; letter-spacing:.2em; padding-left:.2em; }
    .box { border-radius:3px; transition:background .35s var(--ease),color .35s var(--ease); }
    .box:hover { background:var(--cobalt); color:var(--paper); }
    .cv { box-shadow:0 26px 45px -18px rgba(0,0,0,.7); }
    .play { transition:background .3s var(--ease),color .3s var(--ease); }
    .play:hover { background:var(--cobalt); color:var(--paper); }
    .cursor[data-mode="open"] .cursor-word { color:var(--paper); }
    .details-watch:hover { color:var(--paper); }
    @media (max-width:767px) {
      .brand-zh { font-size:19px; }
      .brand-en { font-size:7px; }
      .topbar .brand { transform:translateY(5px); }
    }

    .cv::before { content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
      background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.12) 3%,transparent 8%,transparent 95%,rgba(0,0,0,.2)); }
    .poster { aspect-ratio:474 / 750; }
    .face { border-radius:3px; }
    .sp { border-radius:5px 5px 2px 2px; }
    .sp::before { content:''; position:absolute; z-index:2; inset:0; pointer-events:none;
      background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(255,255,255,.2) 18%,transparent 38%,rgba(0,0,0,.12) 75%,rgba(0,0,0,.6));
      box-shadow:inset 0 2px 1px rgba(255,255,255,.2),inset 0 -3px 3px rgba(0,0,0,.5); }
    .spine-title,.spine-author { position:absolute; color:#fff4dc; writing-mode:vertical-rl;
      font-family:'Newsreader','Noto Serif SC',Georgia,serif; text-shadow:0 1px 2px rgba(0,0,0,.55); }
    .spine-title { top:6%; left:24%; max-height:66%; font-size:calc(var(--H) * .044); line-height:1.05; }
    .spine-author { bottom:7%; right:12%; max-height:36%; font-size:calc(var(--H) * .025); opacity:.85; }
    .sp[data-country="China"] .spine-title { font-size:calc(var(--H) * .065); letter-spacing:.15em; }
    .spine-art { position:absolute; bottom:5%; left:15%; width:52%; height:16%; object-fit:cover; border-radius:1px; opacity:.92; }
    .cv { border-radius:2px 5px 5px 2px; box-shadow:6px 24px 38px -15px rgba(0,0,0,.8); }
    .cv::before { background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(255,255,255,.22) 1.5%,rgba(0,0,0,.18) 3%,transparent 6%,transparent 96%,rgba(255,255,255,.17) 99%,rgba(0,0,0,.45));
      box-shadow:inset 0 1px 1px rgba(255,255,255,.3),inset 0 -2px 2px rgba(0,0,0,.4); }
    .page-edge { position:absolute; width:calc(var(--ws) - 4px); height:calc(var(--H) - 6px);
      left:calc(var(--ws) / -2 + 2px); top:calc(var(--H) / -2 + 3px);
      transform:rotateY(180deg) translateZ(calc(var(--d) / 2 - 4px)); backface-visibility:hidden;
      background:repeating-linear-gradient(90deg,#d5ccaf 0,#e8e0ca 1px,#c6bda4 2px,#e4dcc5 3px); }
    .book-cap { position:absolute; width:calc(var(--ws) - 4px); height:calc(var(--d) - 7px);
      left:calc(var(--ws) / -2 + 2px); top:calc(var(--d) / -2 + 2px);
      transform:rotateX(90deg) translateZ(calc(var(--H) / 2 - 2px)); backface-visibility:hidden;
      background:repeating-linear-gradient(90deg,#d5ccaf 0,#e8e0ca 1px,#c6bda4 2px,#e4dcc5 3px); }
    .cap-mask.title,.details-title { font-family:'Newsreader','Noto Serif SC',Georgia,serif; }
    .poster { filter:drop-shadow(8px 24px 22px rgba(0,0,0,.5)); }
  </style>
</head>
<body id="filmography">
  <header class="topbar">
    <a class="back box lbl" href="#filmography" id="backBtn">THE SHELF</a>
    <div class="brand" aria-label="Kitab Ghar — کتاب گھر">
      <div class="brand-zh">کتاب گھر</div><div class="brand-en">KITAB GHAR · PAKISTAN</div>

  <nav class="decades" aria-label="Book categories" id="decades">

            <clipPath id="posterClip" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="474" height="900" /></clipPath>
            <filter id="inkBleed" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
              <feTurbulence baseFrequency=".011" numOctaves="3" seed="7" type="fractalNoise" result="noise" />

        </svg>
      </div>
    </div>
  </div>
<script>
(() => {
  'use strict';
  const BOOKS = [
  {
    "id": "0",
    "title": "Pakistan: A Personal History",
    "author": "Imran Khan",
    "genre": "Pakistan",
    "isbn": "9780857500649",
    "synopsis": "A personal account of Pakistan through family, cricket, faith, and public life.",
    "url": "https://openlibrary.org/isbn/9780857500649",

    }
  });
  // Wheel (both axes) and drag scrub the same physical target coordinate.
  window.addEventListener('wheel',e=>{
    if(isOpen) return;
    e.preventDefault();
    const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
    T+=clamp(delta,-120,120)/(ws+gap)*.34;
    lastWheel=performance.now();
  },{passive:false});
  shelf.addEventListener('pointerdown',e=>{
    if(isOpen || (e.button!==0 && e.pointerType==='mouse')) return;
    drag={id:e.pointerId,x:e.clientX,T0:T,moved:false};
  });
  window.addEventListener('pointermove',e=>{
    if(!drag || drag.id!==e.pointerId) return;
    const dx=e.clientX-drag.x;
    if(Math.abs(dx)>5) drag.moved=true;
    if(drag.moved) T=drag.T0-dx/(ws+gap);
  });
  function endDrag(e) {
    if(!drag || drag.id!==e.pointerId) return;
    if(drag.moved) {T=Math.round(T);suppressClickUntil=performance.now()+350;}
    drag=null;
  }
  window.addEventListener('pointerup',endDrag);
  window.addEventListener('pointercancel',endDrag);
  document.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;},{passive:true});
  document.addEventListener('pointerleave',()=>{mx=-10000;my=-10000;});
  window.addEventListener('resize',measure,{passive:true});

  function render(now) {
    const dt=Math.min(50,now-lastFrame)/1000;lastFrame=now;
    if(lastWheel>=0 && now-lastWheel>200) {T=Math.round(T);lastWheel=-1;}
    const k=isReduced()?1000:(drag?.moved?22:6.5);
    s+=(T-s)*(1-Math.exp(-k*dt));
    if(Math.abs(T-s)<.0001) s=T;
    if(Math.abs(s)>bookCount*4) { const loops=Math.trunc(s/bookCount);s-=loops*bookCount;T-=loops*bookCount; }
    const newActive=wrap(Math.round(s),bookCount);
    if(newActive!==active && !isOpen) {
      const direction=Math.sign(T-s)||1;
      active=newActive;captionSwap(active,direction);
      updateTab();
    }
    const nearing=Math.abs(T-s)<.3 && !isOpen;
    onCover=nearing && Math.abs(mx-W/2)<d*.55 && Math.abs(my-cyShelf)<H*.55;
    const wantedY=onCover?(mx-W/2)/(d*.55)*9:(mx-W/2)/W*5;
    const wantedX=onCover?-(my-cyShelf)/(H/2)*6:0;
    const tiltEase=isReduced()?1:1-Math.exp(-7*dt);
    tiltX+=(wantedX-tiltX)*tiltEase;tiltY+=(wantedY-tiltY)*tiltEase;
    const centreExtra=(d-ws+1.6*gap);
    let activeItem=null,best=Infinity;
    for(const item of tapes) {
      const r=relative(item.v);item.r=r;
      const x=r*(ws+gap)+centreExtra*B(r);
      if(Math.abs(x)>W/2+1.5*d) {item.el.style.visibility='hidden';continue;}
      item.el.style.visibility='visible';
      const o=smoothstep(Math.max(0,1-Math.abs(r)));
      const liftTarget=(hover===item.v && Math.abs(r)>.5 && !isOpen)?1:0;
      const liftEase=isReduced()?1:(1-Math.exp(-12*dt));
      item.lift+=(liftTarget-item.lift)*liftEase;
      const y=-o*.025*H-item.lift*.065*H;
      item.el.style.transform=`translate3d(${x}px,${y}px,${o*.2*H}px) rotateZ(${-3.5*o-item.lift*1.5}deg) rotateX(${tiltX*o}deg) rotateY(${(-90+tiltY)*o}deg)`;
      item.el.style.zIndex=String(Math.round(100-Math.abs(r)*4));
      item.sp.style.setProperty('--shade',(o*.55).toFixed(4));
      item.cv.style.setProperty('--shade',((1-o)*.5).toFixed(4));
      if(Math.abs(r)<best) {best=Math.abs(r);activeItem=item;}
    }
    const playScale=isOpen?0:smoothstep(Math.max(0,1-Math.abs(T-s)*3));
    play.style.left=`${W/2-.5*d-6}px`;
    play.style.top=`${cyShelf+.36*H}px`;
    play.style.transform=`translate(-50%,-50%) scale(${playScale})`;
    play.style.pointerEvents=playScale>.5?'auto':'none';
    // The cursor is a spring-smoothed overlay, never subject to shelf transforms.
    const cEase=isReduced()?1:1-Math.exp(-16*dt);
    cx+=(mx-cx)*cEase;cy+=(my-cy)*cEase;
    cursor.style.transform=`translate3d(${cx}px,${cy}px,0)`;
    if(fine.matches) {
      let mode='default';
      if(!isOpen && onCover) mode='open';
      else {
        const target=document.elementFromPoint(mx,my);
        if(target?.closest('button,a')) mode='btn';
        else if(!isOpen && target?.closest('.tape')) mode='spine';
      }
      if(cursor.dataset.mode!==mode) cursor.dataset.mode=mode;
    }
    if(posterAnimating) {
      if(isReduced()) {circles.forEach(c=>c.setAttribute('r','720'));posterAnimating=false;}
      else {
        const elapsed=now-inkStart;
        for(const c of circles) {
          const delay=Number(c.dataset.delay);
          c.setAttribute('r',String(720*easeOut((elapsed-delay)/1250)));
        }
        if(elapsed>1700) posterAnimating=false;
      }
    }
    requestAnimationFrame(render);
  }
  measure();captionSwap(active,1,true);updateTab(false);
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
